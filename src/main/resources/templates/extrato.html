<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recibo Oficial - Coletaê</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        body { background: #555; padding: 40px; font-family: 'Courier New', monospace; }
        .folha { background: white; max-width: 800px; margin: 0 auto; padding: 50px; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .folha { padding: 20px; width: 100%; }
            .botoes-topo { flex-direction: column; }
            .btn { width: 100%; margin-bottom: 10px; }
        }

        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none; }
            .folha { box-shadow: none !important; margin: 0; width: 100%; max-width: 100%; padding: 0; }
        }
    </style>
</head>
<body>

<div class="text-center mb-4 no-print d-flex flex-wrap justify-content-center gap-2 botoes-topo">

    <a href="/meus-extratos" class="btn btn-outline-secondary fw-bold">
        <i class="bi bi-arrow-left"></i> Voltar p/ Extratos
    </a>

    <button onclick="window.print()" class="btn btn-success">
        <i class="bi bi-printer"></i> Imprimir / PDF
    </button>

    <button onclick="enviarZap('empresa')" class="btn btn-primary">
        <i class="bi bi-whatsapp"></i> Enviar p/ Empresa
    </button>

    <button onclick="enviarZap('cliente')" class="btn btn-outline-info text-dark fw-bold">
        <i class="bi bi-person-check"></i> Enviar p/ Cliente
    </button>

    <a href="/admin/coletas" class="btn btn-secondary">Nova Coleta</a>
</div>

<input type="hidden" id="jsNome" th:value="${vendedor.nome}">
<input type="hidden" id="jsTelefone" th:value="${vendedor.telefone}">
<input type="hidden" id="jsTotal" th:value="${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}">

<div class="folha shadow">
    <div class="text-center border-bottom pb-4 mb-4">
        <h2 class="fw-bold text-success text-uppercase">Coletaê Salgueiro</h2>
        <p class="text-muted small">RECIBO DE PAGAMENTO / COMPROVANTE DE RENDA</p>
    </div>

    <div class="row mb-4">
        <div class="col-8">
            <strong>BENEFICIÁRIO:</strong><br>
            <span th:text="${vendedor.nome}" class="fs-5 text-uppercase">NOME</span><br>
            <small class="text-muted">CPF: <span th:text="${vendedor.cpf != null ? vendedor.cpf : 'NÃO INFORMADO'}"></span></small>
        </div>
        <div class="col-4 text-end">
            <strong>DATA:</strong><br>
            <span th:text="${#temporals.format(dataHoje, 'dd/MM/yyyy')}">Data</span>
        </div>
    </div>

    <table class="table table-bordered border-dark align-middle">
        <thead class="table-light">
        <tr>
            <th>MATERIAL</th>
            <th class="text-center">QTD/PESO</th>
            <th class="text-center">PREÇO UN.</th>
            <th class="text-end">TOTAL</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${vendas.empty}">
            <td colspan="4" class="text-center text-muted">Nenhum valor processado.</td>
        </tr>
        <tr th:each="venda : ${vendas}">
            <td th:text="${venda.material}">Material</td>
            <td class="text-center">
                <span th:text="${venda.peso}">0.0</span>
                <span th:text="${mapaUnidades.getOrDefault(venda.material, 'UN')}" class="small text-muted">KG</span>
            </td>
            <td class="text-center">
                R$ <span th:text="${#numbers.formatDecimal(mapaPrecos.get(venda.material), 1, 'POINT', 2, 'COMMA')}">0,00</span>
            </td>
            <td class="text-end fw-bold"
                th:text="'R$ ' + ${#numbers.formatDecimal(venda.precoEstimado, 1, 'POINT', 2, 'COMMA')}">
                R$ 0,00
            </td>
        </tr>
        </tbody>
        <tfoot>
        <tr class="table-success">
            <td colspan="3" class="text-end fw-bold">TOTAL LÍQUIDO:</td>
            <td class="text-end fw-bold fs-4"
                th:text="'R$ ' + ${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}">
                R$ 0,00
            </td>
        </tr>
        </tfoot>
    </table>

    <div class="mt-5 text-center w-50 mx-auto">
        <img src="/img/assinatura.png"
             alt="Assinatura"
             style="width: 200px; mix-blend-mode: multiply; filter: contrast(150%) brightness(110%); margin-bottom: 5px;"
             onerror="this.style.display='none'">
        <div class="border-top border-dark border-2"></div>
        <small class="text-muted fw-bold">Assinatura do Responsável</small>
    </div>
</div>

<script>
    function enviarZap(destino) {
        let nome = document.getElementById("jsNome").value;
        let total = document.getElementById("jsTotal").value;
        let telefoneCliente = document.getElementById("jsTelefone").value;

        let msg = `🧾 *RECIBO COLETAÊ SALGUEIRO*\n\nOlá *${nome}*,\nSeu pagamento de *R$ ${total}* foi processado com sucesso.\n\n✅ *Status:* Pago\n📍 *Local:* Salgueiro-PE\n\n_Obrigado por reciclar conosco!_`;

        let numeroDestino = (destino === 'empresa') ? "5587991919496" : "55" + telefoneCliente;

        let url = `https://wa.me/${numeroDestino}?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
    }
</script>
<script>
    // Se a URL tiver o "?autoPrint=true", ele abre a janela de impressão sozinho!
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('autoPrint') === 'true') {
            // Delay de 0.5s para garantir que as imagens (assinatura) carreguem antes de gerar o PDF
            setTimeout(function() {
                window.print();
            }, 500);
        }
    };
</script>
</body>
</html>
