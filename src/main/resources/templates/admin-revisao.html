<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <title>Revisão - Coletaê</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin-revisao.css(v=2)}">
</head>
<body class="bg-body-tertiary">

<!-- Fase 31: revisão com subtotal por material, total ao vivo e aviso quando o preço foi negociado -->
<header class="topo-revisao">
    <div class="container d-flex align-items-center justify-content-between gap-2" style="max-width: 900px;">
        <div class="d-flex align-items-center gap-2">
            <span class="passo">1 Pesagem</span><i class="bi bi-chevron-right opacity-50"></i>
            <span class="passo passo-ativo">2 Revisão</span><i class="bi bi-chevron-right opacity-50"></i>
            <span class="passo">3 Recibo</span>
        </div>
    </div>
</header>

<div class="container py-4" style="max-width: 900px;">
    <form action="/admin/confirmar-finalizacao" method="post" onsubmit="return prepararEnvio(this);">
        <input type="hidden" name="idVendedor" th:value="${vendedor.id}">
        <input type="hidden" id="idArmazem" th:value="${session.idPlanilhaAtiva}">

        <div class="card-body p-0">
            <!-- Cliente -->
            <div class="card border-0 shadow-sm rounded-4 mb-3"><div class="card-body p-4">
                <div class="row g-3 align-items-center">
                    <div class="col-md-6 d-flex align-items-center gap-3 min-w-0">
                        <div class="cliente-avatar" aria-hidden="true"
                             th:text="${vendedor.nome != null and !#strings.isEmpty(vendedor.nome) ? #strings.toUpperCase(#strings.substring(vendedor.nome,0,1)) : '?'}">M</div>
                        <div class="min-w-0">
                            <div class="small text-body-secondary">Fornecedor</div>
                            <div class="fs-5 fw-bold text-truncate" th:text="${vendedor.nome}">Maria da Silva</div>
                            <span class="badge bg-warning text-dark" th:if="${precosVip != null and !precosVip.isEmpty()}"><i class="bi bi-star-fill"></i> Preços VIP aplicados</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold mb-1" for="cpfFinal">CPF ou CNPJ do fornecedor <span class="fw-normal text-body-secondary">(opcional, sai no recibo)</span></label>
                        <input type="text" name="cpfFinal" id="cpfFinal" class="form-control" th:value="${vendedor.cpf}"
                               placeholder="CPF ou CNPJ" maxlength="18" oninput="formatarCPF(this)" autocomplete="off">
                    </div>
                </div>
            </div></div>

            <!-- Itens -->
            <div class="card border-0 shadow-sm rounded-4 mb-3"><div class="card-body p-0">
                <div class="d-flex justify-content-between align-items-center px-4 pt-4 pb-2">
                    <h2 class="h6 fw-bold mb-0">Materiais</h2>
                    <span class="small text-body-secondary">Se combinou outro preço, altere o valor por unidade.</span>
                </div>
                <div class="cabecalho-itens d-none d-md-grid px-4">
                    <span>Material</span><span class="text-end">Quantidade</span><span>Preço por unidade</span><span class="text-end">Subtotal</span>
                </div>
                <div th:each="item : ${itens}" class="item-revisao px-4"
                     th:attr="data-peso=${item.peso},data-tabela=${item.material.precoPorKg}">
                    <input type="hidden" name="idsMateriais" th:value="${item.material.id}">
                    <input type="hidden" name="pesosFinais" th:value="${item.peso}">
                    <div class="min-w-0">
                        <div class="fw-bold text-truncate" th:text="${item.material.nome}">Latinhas</div>
                        <div class="small text-body-secondary">
                            Tabela<span th:if="${precosVip != null and precosVip.containsKey(item.material.nome)}"> VIP</span>:
                            R$ <span th:text="${#numbers.formatDecimal(item.material.precoPorKg, 1, 'POINT', 2, 'COMMA')}">4,50</span>
                            <span class="badge bg-info-subtle text-info-emphasis negociado d-none">negociado</span>
                        </div>
                    </div>
                    <div class="text-md-end">
                        <span class="qtd" th:text="${#numbers.formatDecimal(item.peso, 1, 'POINT', 2, 'COMMA')} + ' ' + ${item.material.unidade == 'UN' ? 'un' : 'kg'}">4,00 kg</span>
                    </div>
                    <div>
                        <div class="input-group input-group-sm">
                            <span class="input-group-text">R$</span>
                            <input type="number" step="0.01" min="0.01" max="100000" required name="precosFinais"
                                   class="form-control fw-bold campo-preco" th:value="${item.material.precoPorKg}" inputmode="decimal"
                                   th:attr="aria-label='Preço por unidade de ' + ${item.material.nome}">
                            <button type="button" class="btn btn-outline-secondary voltar-tabela d-none" title="Voltar ao preço da tabela" aria-label="Voltar ao preço da tabela"><i class="bi bi-arrow-counterclockwise"></i></button>
                        </div>
                    </div>
                    <div class="text-end fw-bold subtotal">R$ 0,00</div>
                </div>
            </div></div>

            <!-- Total e ações -->
            <div class="card border-0 shadow-sm rounded-4 total-card"><div class="card-body p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <div>
                        <div class="small text-body-secondary">Total a pagar ao fornecedor</div>
                        <div class="total-valor" id="totalRevisao">R$ 0,00</div>
                        <div class="small text-body-secondary" id="totalPesos"></div>
                    </div>
                    <div class="d-flex gap-2 flex-grow-1 flex-md-grow-0">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg fw-bold"><i class="bi bi-arrow-left"></i> Voltar</a>
                        <button type="submit" class="btn btn-success btn-lg fw-bold flex-grow-1">
                            Finalizar e gerar recibo <i class="bi bi-check2-circle ms-1"></i>
                        </button>
                    </div>
                </div>
            </div></div>
        </div>
    </form>
</div>

<script th:src="@{/js/rascunho.js}"></script>
<script th:src="@{/js/documento.js(v=1)}"></script>
<script th:src="@{/js/admin-revisao.js(v=3)}"></script>
</body>
</html>
