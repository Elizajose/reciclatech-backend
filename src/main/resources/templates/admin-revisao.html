<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <title>Revisão Final - Coletaê</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- CSS EXTERNO -->
    <link rel="stylesheet" th:href="@{/css/admin-revisao.css}">
</head>
<body class="pb-5 pt-4">

<div class="container container-revisao">

    <div class="alert alert-warning border-0 shadow-sm d-flex align-items-center gap-3 rounded-4 mb-4">
        <i class="bi bi-exclamation-circle-fill fs-2 text-warning"></i>
        <div>
            <h6 class="fw-bold mb-1">Última Revisão</h6>
            <span class="small mb-0">Verifique os pesos registrados. Se necessário, você pode alterar o preço unitário pago por kg antes de finalizar.</span>
        </div>
    </div>

    <div class="card shadow-lg">
        <div class="card-header bg-dark text-white py-3 px-4 rounded-top-4 border-0">
            <h4 class="m-0 fw-bold"><i class="bi bi-check-all me-2"></i> Fechamento e Pagamento</h4>
        </div>

        <form action="/admin/confirmar-finalizacao" method="post">
            <input type="hidden" name="idVendedor" th:value="${vendedor.id}">

            <div class="card-body p-4 p-md-5 bg-body">

                <!-- Dados do Cliente e CPF -->
                <div class="row align-items-center bg-body-tertiary rounded-4 p-4 mb-5 border">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <p class="text-muted small fw-bold mb-1 text-uppercase">Fornecedor / Catador</p>
                        <h4 class="fw-bold text-primary m-0">
                            <i class="bi bi-person-badge me-2"></i><span th:text="${vendedor.nome}">Nome</span>
                        </h4>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold small text-muted mb-2 text-uppercase"><i class="bi bi-card-text me-1"></i> CPF para Nota (Opcional)</label>
                        <input type="text" name="cpfFinal"
                               class="form-control form-control-lg border-secondary-subtle"
                               th:value="${vendedor.cpf}"
                               placeholder="000.000.000-00"
                               maxlength="14"
                               oninput="formatarCPF(this)"
                               inputmode="numeric">
                    </div>
                </div>

                <h5 class="fw-bold text-body-emphasis mb-3">Resumo dos Materiais</h5>

                <div class="table-responsive border rounded-4 mb-5">
                    <table class="table table-revisao table-hover mb-0 bg-body">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">Material</th>
                            <th class="text-center">Peso Registrado</th>
                            <th style="min-width: 180px;" class="pe-4">Preço Negociado (Unidade)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${itens}">
                            <input type="hidden" name="idsMateriais" th:value="${item.material.id}">

                            <td class="ps-4">
                                <span class="fw-bold text-body-emphasis fs-6" th:text="${item.material.nome}">Material</span>
                            </td>

                            <td class="text-center">
                                <input type="hidden" name="pesosFinais" th:value="${item.peso}">
                                <span class="badge bg-secondary bg-opacity-10 text-body border border-secondary-subtle px-3 py-2 rounded-pill fs-6"
                                      th:text="${item.peso} + ' ' + ${item.material.unidade}">10 KG</span>
                            </td>

                            <td class="pe-4">
                                <div class="input-group shadow-sm">
                                    <span class="input-group-text bg-body-tertiary text-muted border-end-0">R$</span>
                                    <input type="number" step="0.01" name="precosFinais"
                                           class="form-control fw-bold text-success border-start-0"
                                           th:value="${item.material.precoPorKg}"
                                           inputmode="decimal">
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="row g-3">
                    <div class="col-md-4">
                        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg w-100 fw-bold py-3">
                            <i class="bi bi-arrow-left me-1"></i> Voltar
                        </a>
                    </div>
                    <div class="col-md-8">
                        <button type="submit" class="btn btn-success btn-lg w-100 shadow fw-bold py-3 text-uppercase letter-spacing-1">
                            Finalizar e Gerar Recibo <i class="bi bi-check2-circle ms-2"></i>
                        </button>
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>

<!-- SCRIPT EXTERNO -->
<script th:src="@{/js/admin-revisao.js}"></script>
</body>
</html>
