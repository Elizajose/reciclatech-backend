<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus armazéns | Coletaê</title>
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>body{font-family:Inter,sans-serif;background:#f4f7f5}.brand{color:#198754;font-weight:900}</style>
</head>
<body>
<div class="container py-4" style="max-width:760px">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a th:href="@{/}" class="fs-3 brand text-decoration-none"><i class="bi bi-recycle"></i> Coletaê</a>
        <form th:action="@{/conta/sair}" method="post" class="m-0 d-flex align-items-center gap-2">
            <span class="small text-muted d-none d-sm-inline" th:text="${parceiroNome}"></span>
            <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </form>
    </div>

    <h1 class="h4 fw-bold mb-3">Meus armazéns</h1>

    <div th:if="${param.criado != null}" class="alert alert-success small fw-bold py-2">Armazém cadastrado!</div>
    <div th:if="${param.erro != null and param.erro[0] == 'acesso'}" class="alert alert-danger small fw-bold py-2">Você não tem acesso a esse armazém.</div>
    <div th:if="${param.regiao != null}" class="alert alert-success small fw-bold py-2">Região salva!</div>
    <div th:if="${param.erro != null and param.erro[0] == 'regiao'}" class="alert alert-danger small fw-bold py-2">Estado ou município inválido.</div>

    <div th:if="${#lists.isEmpty(armazens)}" class="card border-0 shadow-sm rounded-4 mb-3"><div class="card-body text-center text-muted py-4">
        Você ainda não tem armazéns nesta conta.</div></div>

    <div th:each="a : ${armazens}" class="card border-0 shadow-sm rounded-4 mb-3"><div class="card-body d-flex justify-content-between align-items-center gap-3">
        <div>
            <div class="fw-bold" th:text="${a.nome}">Armazém</div>
            <div class="small text-muted" th:text="${a.endereco}">Endereço</div>
            <div class="small text-muted" th:if="${a.uf != null and a.cidade != null}"><i class="bi bi-geo-alt"></i> <span th:text="|${a.cidade} - ${a.uf}|">Cidade - UF</span></div>
            <span class="badge bg-light text-dark border mt-1" th:text="${a.status}">TRIAL</span>
            <span class="badge bg-light text-dark border mt-1" th:text="${a.plano}">START</span>
            <form th:if="${a.uf == null or a.cidade == null}" th:action="@{/conta/armazens/{id}/regiao(id=${a.id})}" method="post" class="row g-2 mt-2">
                <div class="col-12 small text-warning fw-bold"><i class="bi bi-exclamation-triangle"></i> Informe a região para aparecer no filtro da página inicial.</div>
                <div class="col-5"><select name="uf" class="form-select form-select-sm" required>
                    <option value="" disabled selected>UF</option><option value="AC">Acre (AC)</option><option value="AL">Alagoas (AL)</option><option value="AP">Amapá (AP)</option><option value="AM">Amazonas (AM)</option><option value="BA">Bahia (BA)</option><option value="CE">Ceará (CE)</option><option value="DF">Distrito Federal (DF)</option><option value="ES">Espírito Santo (ES)</option><option value="GO">Goiás (GO)</option><option value="MA">Maranhão (MA)</option><option value="MT">Mato Grosso (MT)</option><option value="MS">Mato Grosso do Sul (MS)</option><option value="MG">Minas Gerais (MG)</option><option value="PR">Paraná (PR)</option><option value="PB">Paraíba (PB)</option><option value="PA">Pará (PA)</option><option value="PE">Pernambuco (PE)</option><option value="PI">Piauí (PI)</option><option value="RN">Rio Grande do Norte (RN)</option><option value="RS">Rio Grande do Sul (RS)</option><option value="RJ">Rio de Janeiro (RJ)</option><option value="RO">Rondônia (RO)</option><option value="RR">Roraima (RR)</option><option value="SC">Santa Catarina (SC)</option><option value="SE">Sergipe (SE)</option><option value="SP">São Paulo (SP)</option><option value="TO">Tocantins (TO)</option>
                </select></div>
                <div class="col-7"><input type="text" name="cidade" class="form-control form-control-sm" placeholder="Município" maxlength="100" required></div>
                <div class="col-12 d-grid"><button type="submit" class="btn btn-outline-success btn-sm">Salvar região</button></div>
            </form>
        </div>
        <form th:action="@{/conta/armazens/{id}/entrar(id=${a.id})}" method="post" class="m-0">
            <button type="submit" class="btn btn-success fw-bold">Entrar</button>
        </form>
    </div></div>

    <a th:href="@{/conta/armazens/novo}" class="btn btn-outline-success fw-bold mb-4"><i class="bi bi-plus-lg"></i> Cadastrar novo armazém</a>

</div>
</body>
</html>
