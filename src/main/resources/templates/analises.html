<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Coletaê Análises</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card { border-radius: 12px; border: none; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .stat-card { color: white; }
        .chart-container { height: 250px; position: relative; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-cpu"></i> Inteligência de Negócio - Coletaê</h2>
        <a href="/admin/coletas" class="btn btn-outline-dark"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card shadow-sm p-3 bg-primary text-white">
                <h6><i class="bi bi-people"></i> Clientes Atendidos</h6>
                <h3 th:text="${totalAtendimentos}">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm p-3 bg-danger text-white">
                <h6><i class="bi bi-cash-stack"></i> Total Pago (Saída)</h6>
                <h3>R$ <span th:text="${#numbers.formatDecimal(totalPago, 1, 'POINT', 2, 'COMMA')}">0,00</span></h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm p-3 bg-success text-white">
                <h6><i class="bi bi-box-seam"></i> Volume Total (KG)</h6>
                <h3><span th:text="${#numbers.formatDecimal(totalKg, 1, 'POINT', 2, 'COMMA')}">0,00</span> kg</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm p-3 bg-warning text-dark">
                <h6><i class="bi bi-layers"></i> Volume Total (UN)</h6>
                <h3><span th:text="${#numbers.formatInteger(totalUn, 1)}">0</span> un</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="card-title fw-bold text-muted"><i class="bi bi-graph-up"></i> Evolução de Compras (Volume Geral)</h5>
                <hr>
                <div style="height: 300px;">
                    <canvas id="graficoVolume"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="card-title fw-bold text-muted text-center"><i class="bi bi-pie-chart"></i> Mix de Materiais (KG)</h5>
                <hr>
                <div class="chart-container">
                    <canvas id="graficoKg"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="card-title fw-bold text-muted text-center"><i class="bi bi-pie-chart-fill"></i> Mix de Materiais (UN)</h5>
                <hr>
                <div class="chart-container">
                    <canvas id="graficoUn"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const volumeData = /*[[${volumeDados}]]*/ {};
    const dataKg = /*[[${dadosRoscaKg}]]*/ {};
    const dataUn = /*[[${dadosRoscaUn}]]*/ {};

    const cores = ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#6610f2', '#fd7e14', '#20c997', '#adb5bd'];

    // 1. Gráfico de Volume (Linha)
    new Chart(document.getElementById('graficoVolume').getContext('2d'), {
        type: 'line',
        data: {
            labels: Object.keys(volumeData),
            datasets: [{
                label: 'Volume Total',
                data: Object.values(volumeData),
                borderColor: '#0d6efd',
                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                fill: true,
                tension: 0.4
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // 2. Gráfico KG (Rosca)
    new Chart(document.getElementById('graficoKg').getContext('2d'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(dataKg),
            datasets: [{
                data: Object.values(dataKg),
                backgroundColor: cores
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } }
        }
    });

    // 3. Gráfico UN (Rosca)
    new Chart(document.getElementById('graficoUn').getContext('2d'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(dataUn),
            datasets: [{
                data: Object.values(dataUn),
                backgroundColor: cores
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } }
        }
    });
</script>
</body>
</html>
