<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Coletaê Análises</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <meta http-equiv="refresh" content="30">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-bar-chart-steps"></i> Inteligência de Negócio</h2>
        <a href="/admin/coletas" class="btn btn-secondary">Voltar</a>
    </div>

    <div class="row">
        <div class="col-md-8 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="card-title">Volume Coletado (KG) - Últimos 7 Dias</h5>
                <canvas id="graficoVolume"></canvas>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="card-title">Materiais mais Vendidos</h5>
                <canvas id="graficoMateriais"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="container-fluid mt-4">
    <h2 class="mb-4">📊 Painel de Análises - ReciclaTech</h2>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card bg-primary text-white shadow">
                <div class="card-body text-center">
                    <h6>Total de Atendimentos</h6>
                    <h2 th:text="${totalAtendimentos}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white shadow">
                <div class="card-body text-center">
                    <h6>Peso Total (kg)</h6>
                    <h2 th:text="${#numbers.formatDecimal(volumeDados.values().stream().mapToDouble(Double::doubleValue).sum(), 1, 2)}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-dark shadow">
                <div class="card-body text-center">
                    <h6>Faturamento Total</h6>
                    <h2>R$ <span th:text="${#numbers.formatDecimal(financeiroDados.values().stream().mapToDouble(Double::doubleValue).sum(), 1, 2)}">0,00</span></h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 mb-4">
            <div class="card shadow">
                <div class="card-header">📈 Tendência de Coletas (Volume kg / Dia)</div>
                <div class="card-body">
                    <canvas id="graficoLinha"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow">
                <div class="card-header">♻️ Mix de Materiais (Peso %)</div>
                <div class="card-body">
                    <canvas id="graficoPizza"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // Dados vindos do Java (Controller)
    const volumeData = /*[[${volumeDados}]]*/ {};
    const materialData = /*[[${materialDados}]]*/ {};

    // Gráfico de Linha
    new Chart(document.getElementById('graficoLinha'), {
        type: 'line',
        data: {
            labels: Object.keys(volumeData),
            datasets: [{
                label: 'Quilos Reciclados',
                data: Object.values(volumeData),
                borderColor: '#28a745',
                fill: true,
                backgroundColor: 'rgba(40, 167, 69, 0.1)'
            }]
        }
    });

    // Gráfico de Pizza
    new Chart(document.getElementById('graficoPizza'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(materialData),
            datasets: [{
                data: Object.values(materialData),
                backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545', '#6610f2']
            }]
        }
    });
</script>
</body>
</html>
