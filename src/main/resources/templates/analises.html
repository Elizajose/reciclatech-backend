<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Coletaê Análises</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-bar-chart-steps"></i> Inteligência de Negócio</h2>
        <a href="/admin/coletas" class="btn btn-secondary">Voltar</a>
    </div>

    <div class="row">
        <div class="col-md-8 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="card-title">Volume Coletado (KG) - Últimos 7 Dias</h5>
                <canvas id="graficoVolume"></canvas>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="card-title">Materiais mais Vendidos</h5>
                <canvas id="graficoMateriais"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // Aqui o Java injetará os dados dinamicamente
    const ctxVolume = document.getElementById('graficoVolume');
    new Chart(ctxVolume, {
        type: 'line',
        data: {
            labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab', 'Dom'],
            datasets: [{
                label: 'Quilos Coletados',
                data: [120, 190, 300, 250, 400, 150, 0], // Dados de exemplo
                borderColor: '#198754',
                tension: 0.3
            }]
        }
    });
</script>
</body>
</html>
