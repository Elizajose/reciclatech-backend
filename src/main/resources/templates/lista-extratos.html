<!DOCTYPE html>
<html xmlns:th="[http://www.thymeleaf.org](http://www.thymeleaf.org)" data-bs-theme="light">
<head>
    <title>Central de Extratos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light p-3 p-md-5">

<div class="container" style="max-width: 800px;">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="text-success fw-bold m-0"><i class="bi bi-files"></i> Extratos de Hoje</h2>
            <small class="text-muted"><i class="bi bi-clock"></i> O histórico exibe apenas vendas das últimas 24h.</small>
        </div>
        <a href="/admin/coletas" class="btn btn-outline-secondary">Voltar para Painel</a>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-success">
                    <tr>
                        <th class="ps-4 py-3 text-nowrap">Colaborador</th>
                        <th>ID</th>
                        <th class="text-end pe-4">Documento</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:if="${usuarios.empty}">
                        <td colspan="3" class="text-center py-5 text-muted">
                            <i class="bi bi-calendar-x fs-1 opacity-50"></i>
                            <p class="mt-2 fw-bold">Nenhum atendimento finalizado hoje.</p>
                            <small>Novas vendas aparecerão aqui automaticamente.</small>
                        </td>
                    </tr>

                    <tr th:each="user : ${usuarios}">
                        <td class="ps-4 fw-bold text-nowrap">
                            <i class="bi bi-person-circle text-success me-2"></i>
                            <span th:text="${user.nome}">Nome</span>
                        </td>
                        <td><span class="badge bg-secondary" th:text="'ID: ' + ${user.id}">ID</span></td>
                        <td class="text-end pe-4">
                            <a th:href="@{|/extrato/${user.id}?autoPrint=true|}" target="_blank" class="btn btn-success rounded-pill">
                                <i class="bi bi-printer"></i> Imprimir Extrato
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="alert alert-warning mt-4 text-center small">
        <i class="bi bi-exclamation-triangle"></i> Somente ofertas com status <strong>VENDIDO</strong> aparecem aqui.
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
<script>
    // Lê a memória do navegador e aplica o tema na página atual
    document.addEventListener('DOMContentLoaded', () => {
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', currentTheme);
    });
</script>
</html>
