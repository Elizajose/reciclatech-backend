<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo armazém | Coletaê</title>
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>body{font-family:Inter,sans-serif;background:#f4f7f5}.brand{color:#198754;font-weight:900}</style>
</head>
<body>
<div class="container py-4" style="max-width:560px">
    <a th:href="@{/conta/armazens}" class="btn btn-link text-decoration-none text-muted px-0 mb-2"><i class="bi bi-arrow-left"></i> Voltar</a>
    <div class="card shadow-sm border-0 rounded-4"><div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">Cadastrar armazém</h1>
        <p class="text-muted small mb-4">Dados do estabelecimento. Ele ficará vinculado à sua conta.</p>
        <div th:if="${erro != null}" class="alert alert-danger small fw-bold py-2" th:text="${erro}"></div>
        <form th:action="@{/conta/armazens/novo}" method="post">
            <div class="mb-3"><label class="form-label small fw-bold">Nome do armazém / cooperativa</label>
                <input type="text" name="nome" class="form-control" th:value="${nome}" maxlength="150" required autofocus></div>
            <div class="mb-3"><label class="form-label small fw-bold">CPF ou CNPJ <span class="text-muted fw-normal">(opcional)</span></label>
                <input type="text" name="cnpj" class="form-control" th:value="${cnpj}" maxlength="20"></div>
            <div class="mb-3"><label class="form-label small fw-bold">Telefone / WhatsApp</label>
                <input type="text" name="telefone" class="form-control" th:value="${telefone}" maxlength="30" required></div>
            <div class="mb-3"><label class="form-label small fw-bold">Endereço</label>
                <input type="text" name="endereco" class="form-control" th:value="${endereco}" maxlength="255" required></div>
            <div class="mb-4"><label class="form-label small fw-bold d-block">Plano</label>
                <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="plano" id="pStart" value="START" th:checked="${plano == null or plano != PRO}"><label class="form-check-label" for="pStart">START</label></div>
                <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="plano" id="pPro" value="PRO" th:checked="${plano == PRO}"><label class="form-check-label" for="pPro">PRO</label></div></div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Cadastrar armazém</button>
        </form>
    </div></div>
</div>
</body>
</html>
