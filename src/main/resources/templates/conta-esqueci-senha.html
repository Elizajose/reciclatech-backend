<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esqueci minha senha | Coletaê</title>
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin-login.css?v=3}">
    <style th:replace="~{fragments/auth :: estilo}"></style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">
        <div th:replace="~{fragments/auth :: lateral('Sem problemas, a gente ajuda.', 'Recupere o acesso à sua conta em poucos passos e volte a cuidar do seu galpão.', '/img/ilustracao-login.png', false)}"></div>

        <div class="col-lg-6 col-md-7 d-flex align-items-center justify-content-center p-4 bg-white">
            <div class="w-100" style="max-width: 420px;">
                <div class="d-md-none d-flex align-items-center gap-2 fs-2 fw-bold auth-logo-mobile mb-3 justify-content-center"><i class="bi bi-recycle"></i> Coletaê</div>
                <a th:href="@{/login}" data-voltar class="btn btn-link text-decoration-none text-muted px-0 mb-3 d-flex align-items-center gap-2" style="width: fit-content;"><i class="bi bi-arrow-left"></i> Voltar</a>
                <h2 class="fw-bold text-dark mb-1">Esqueci minha senha</h2>
                <p class="text-muted small mb-4">Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para criar uma nova senha.</p>
                <div th:if="${enviado}" class="alert alert-success small fw-bold py-2">
                    Se esse e-mail estiver cadastrado, você receberá um link em instantes. Confira também a caixa de spam.
                </div>
                <form th:unless="${enviado}" th:action="@{/conta/esqueci-senha}" method="post">
                    <div class="mb-4"><label class="form-label small fw-bold text-dark">E-mail</label>
                        <input type="email" name="email" class="form-control form-control-lg fs-6" required autofocus autocomplete="email"></div>
                    <button type="submit" class="btn btn-success w-100 btn-lg fw-bold shadow-sm rounded-3">Enviar link</button>
                </form>
                <p class="text-center small mt-4 mb-0"><a th:href="@{/login}" class="text-success fw-bold text-decoration-none">Voltar para o login</a></p>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/voltar.js}"></script>
</body>
</html>
