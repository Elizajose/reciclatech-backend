<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Esqueci minha senha | Coletaê</title>
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>body{font-family:'Inter',sans-serif;background:#f4f7f5}.brand{color:#198754;font-weight:900}</style>
</head>
<body>
<div class="container py-5" style="max-width:460px">
    <div class="text-center mb-4 fs-2 brand"><i class="bi bi-recycle"></i> Coletaê</div>
    <a th:href="@{/login}" class="btn btn-link text-decoration-none text-muted px-0 mb-2"><i class="bi bi-arrow-left"></i> Voltar para o login</a>
    <div class="card shadow-sm border-0 rounded-4"><div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">Esqueci minha senha</h1>
        <p class="text-muted small mb-4">Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para criar uma nova senha.</p>
        <div th:if="${enviado}" class="alert alert-success small fw-bold py-2">
            Se esse e-mail estiver cadastrado, você receberá um link em instantes. Confira também a caixa de spam.
        </div>
        <form th:unless="${enviado}" th:action="@{/conta/esqueci-senha}" method="post">
            <div class="mb-4"><label class="form-label small fw-bold">E-mail</label>
                <input type="email" name="email" class="form-control" required autofocus autocomplete="email"></div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Enviar link</button>
        </form>
        <p class="text-center small mt-3 mb-0"><a th:href="@{/login}" class="text-success fw-bold text-decoration-none">Voltar para o login</a></p>
    </div></div>
</div>
</body>
</html>
