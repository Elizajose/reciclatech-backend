<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <title>Acesso Restrito - Financeiro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bs-tertiary-bg);
        }
        .auth-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }
        .icon-wrapper {
            width: 80px;
            height: 80px;
            background-color: rgba(220, 53, 69, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card auth-card p-4 p-md-5 text-center bg-body mx-3" style="width: 100%; max-width: 420px;">
    <div class="icon-wrapper">
        <i class="bi bi-shield-lock-fill text-danger" style="font-size: 2.5rem;"></i>
    </div>
    <h4 class="fw-bold mb-2 text-body-emphasis">Área Protegida</h4>
    <p class="text-muted small mb-4">Insira sua senha financeira para acessar a inteligência de negócios do galpão.</p>

    <form action="/admin/analises/autenticar" method="post">
        <div class="form-floating mb-3 shadow-sm rounded-3">
            <input type="password" name="senhaGestor" id="senhaGestor" class="form-control text-center fs-5 fw-bold rounded-3" placeholder="****" required autofocus>
            <label for="senhaGestor" class="text-muted"><i class="bi bi-key me-1"></i> Senha do Gestor</label>
        </div>

        <div th:if="${erro}" class="alert alert-danger p-2 small fw-bold mb-3 rounded-3" th:text="${erro}"></div>

        <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold rounded-pill mb-3 shadow-sm mt-2 py-3">
            Desbloquear Painel <i class="bi bi-unlock-fill ms-1"></i>
        </button>

        <a href="/admin/coletas" class="text-muted text-decoration-none small fw-bold">
            <i class="bi bi-arrow-left me-1"></i> Voltar ao Atendimento
        </a>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', currentTheme);
    });
</script>
</body>
</html>
