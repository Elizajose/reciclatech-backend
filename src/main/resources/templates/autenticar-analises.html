<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Acesso Restrito</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow-lg p-4 text-center" style="width: 350px; border-radius: 15px;">
    <i class="bi bi-shield-lock text-danger" style="font-size: 3rem;"></i>
    <h4 class="fw-bold mt-2">Área do Gestor</h4>
    <p class="text-muted small">Digite a senha para ver faturamento.</p>
    <form action="/admin/analises/autenticar" method="post">
        <input type="password" name="senhaGestor" class="form-control text-center mb-3" placeholder="****" required autofocus>
        <div th:if="${erro}" class="alert alert-danger p-1 small" th:text="${erro}"></div>
        <button type="submit" class="btn btn-danger w-100 fw-bold">Entrar</button>
        <a href="/admin/coletas" class="btn btn-link text-muted text-decoration-none mt-2 small">Voltar</a>
    </form>
</div>
</body>
<script>
    // Lê a memória do navegador e aplica o tema na página atual
    document.addEventListener('DOMContentLoaded', () => {
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', currentTheme);
    });
</script>
</html>
