<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar nova senha | Coletaê</title>
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin-login.css?v=3}">
    <style th:replace="~{fragments/auth :: estilo}"></style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">
        <div th:replace="~{fragments/auth :: lateral('Quase lá!', 'Escolha uma senha nova e segura para voltar ao Coletaê.', '/img/ilustracao-login.png', false)}"></div>

        <div class="col-lg-6 col-md-7 d-flex align-items-center justify-content-center p-4 bg-white">
            <div class="w-100" style="max-width: 420px;">
                <div class="d-md-none d-flex align-items-center gap-2 fs-2 fw-bold auth-logo-mobile mb-3 justify-content-center"><i class="bi bi-recycle"></i> Coletaê</div>
                <a th:href="@{/login}" data-voltar class="btn btn-link text-decoration-none text-muted px-0 mb-3 d-flex align-items-center gap-2" style="width: fit-content;"><i class="bi bi-arrow-left"></i> Voltar</a>
                <h2 class="fw-bold text-dark mb-3">Criar nova senha</h2>
                <div th:if="${!tokenValido}">
                    <div class="alert alert-danger small fw-bold py-2">Este link é inválido, expirou ou já foi usado.</div>
                    <a th:href="@{/conta/esqueci-senha}" class="btn btn-success w-100 btn-lg fw-bold rounded-3">Pedir um novo link</a>
                </div>
                <div th:if="${tokenValido}">
                    <div th:if="${erro != null}" class="alert alert-danger small fw-bold py-2" th:text="${erro}"></div>
                    <form th:action="@{/conta/redefinir-senha}" method="post">
                        <input type="hidden" name="token" th:value="${token}">
                        <div class="mb-3"><label class="form-label small fw-bold text-dark">Nova senha</label>
                            <input type="password" name="senha" class="form-control form-control-lg fs-6" minlength="8" maxlength="72" required autofocus autocomplete="new-password">
                            <div class="form-text">Mínimo de 8 caracteres.</div></div>
                        <div class="mb-4"><label class="form-label small fw-bold text-dark">Confirmar nova senha</label>
                            <input type="password" name="confirmarSenha" class="form-control form-control-lg fs-6" minlength="8" maxlength="72" required autocomplete="new-password"></div>
                        <button type="submit" class="btn btn-success w-100 btn-lg fw-bold shadow-sm rounded-3">Salvar nova senha</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/voltar.js}"></script>
</body>
</html>
