<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <title>Ajuste de Estoque - Coletaê</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-body-tertiary p-3 p-md-5">

<div class="container-lg" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-body-emphasis m-0"><i class="bi bi-boxes text-danger me-2"></i> Ajuste de Estoque</h3>
        <a href="/admin/analises" class="btn btn-secondary shadow-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>

    <div class="card shadow-sm border-0 bg-body p-4">
        <div class="alert alert-info text-dark border-0">
            <i class="bi bi-info-circle-fill me-2"></i> Use esta tela para registrar quebras, perdas por umidade ou sobras. <strong>Isto afetará diretamente o relatório de estoque físico no pátio.</strong>
        </div>

        <form action="/admin/ajuste-estoque/novo" method="post" class="row g-4 mt-1">
            <div class="col-md-6">
                <label class="fw-bold text-body-secondary mb-1">Qual Material?</label>
                <select name="material" class="form-select form-select-lg" required>
                    <option value="" disabled selected>Selecione o item...</option>
                    <option th:each="mat : ${materiais}" th:value="${mat.nome}" th:text="${mat.nome}"></option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="fw-bold text-body-secondary mb-1">Tipo de Ajuste</label>
                <select name="tipoAjuste" class="form-select form-select-lg" required>
                    <option value="AJUSTE_NEGATIVO">(-) Quebra / Perda de Peso</option>
                    <option value="AJUSTE_POSITIVO">(+) Sobra / Achado</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="fw-bold text-body-secondary mb-1">Peso da Diferença</label>
                <div class="input-group input-group-lg">
                    <input type="number" step="0.01" name="peso" class="form-control" placeholder="0.00" required>
                    <span class="input-group-text">KG</span>
                </div>
            </div>

            <div class="col-md-8">
                <label class="fw-bold text-body-secondary mb-1">Motivo do Ajuste</label>
                <input type="text" name="motivo" class="form-control form-control-lg" placeholder="Ex: Papelão secou e perdeu peso" required>
            </div>

            <div class="col-12 mt-4 text-end">
                <button type="submit" class="btn btn-danger btn-lg fw-bold shadow-sm px-5">
                    <i class="bi bi-check2-circle me-1"></i> Aplicar Ajuste
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', currentTheme);
    });
</script>
</body>
</html>
