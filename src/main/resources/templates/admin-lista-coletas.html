<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Área da Equipe - ReciclaTech</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <meta http-equiv="refresh" content="30">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1 fw-bold">
            <i class="bi bi-truck"></i> Área do Gestor
        </span>

        <div class="d-flex gap-2">
            <a href="/admin/precos" class="btn btn-warning fw-bold text-dark">
                <i class="bi bi-currency-dollar"></i> Preços
            </a>

            <a href="/meus-extratos" class="btn btn-outline-light">
                <i class="bi bi-file-text"></i> Extratos
            </a>

            <a href="/sair" class="btn btn-danger">Sair</a>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-3" style="max-width: 800px;">
    <button class="btn btn-warning w-100 fw-bold shadow-sm py-3" data-bs-toggle="modal" data-bs-target="#modalPesagemRapida">
        <i class="bi bi-lightning-charge-fill"></i> COLETA RÁPIDA
    </button>
</div>

<div class="modal fade" id="modalPesagemRapida" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form action="/admin/pesagem-rapida" method="post">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title fw-bold text-dark"><i class="bi bi-lightning-charge-fill"></i> Nova Pesagem Rápida</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted mb-4">Use para atender vizinhos ou clientes na rua que não agendaram pelo site.</p>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome do Cliente</label>
                        <input type="text" name="nome" class="form-control form-control-lg" required placeholder="Ex: João da Silva">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">WhatsApp (Apenas números)</label>
                        <input type="text" name="telefone" class="form-control form-control-lg" required placeholder="Ex: 87999999999">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-success w-100 btn-lg fw-bold">Iniciar Pesagem Agora <i class="bi bi-arrow-right"></i></button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container" style="max-width: 800px;">

    <h5 class="text-muted mb-3 border-bottom pb-2">
        <i class="bi bi-geo-alt-fill text-danger"></i> Clientes Aguardando
    </h5>

    <div class="d-grid gap-3">

        <div th:each="u : ${usuarios}" class="card shadow-sm border-0 border-start border-4 border-success">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title fw-bold m-0" th:text="${u.nome}">Nome do Cliente</h5>

                    <p class="card-text text-muted small mb-1">
                        <i class="bi bi-whatsapp text-success"></i>
                        <span th:text="${u.telefone}"></span>
                    </p>

                    <p class="text-muted small m-0">
                        <i class="bi bi-geo-alt"></i>
                        <span th:if="${not #lists.isEmpty(u.ofertas)}" th:text="${u.ofertas[0].endereco}">Endereço</span>
                    </p>
                </div>

                <a th:href="@{'/admin/atender/' + ${u.id}}" class="btn btn-success fw-bold px-4">
                    ATENDER <i class="bi bi-chevron-right"></i>
                </a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(usuarios)}" class="text-center py-5 text-muted">
            <div class="mb-3">
                <i class="bi bi-check-circle fs-1 text-success opacity-50"></i>
            </div>
            <h5>Nenhum chamado pendente.</h5>
            <small>Aguardando novas solicitações pelo site...</small>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
