<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light"> <!-- Adicionado data-bs-theme -->
<head>
    <title>Área do Gestor - Coletaê Salgueiro</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <meta http-equiv="refresh" content="30">

    <style>
        /* Estabilização dos botões do menu para evitar perda de foco/sumiço */
        .btn-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px; /* Espaço fixo entre ícone e texto */
            transition: all 0.2s ease-in-out;
            font-weight: 600;
            white-space: nowrap; /* Impede que o texto quebre ou desapareça */
            vertical-align: middle;
        }

        .btn-nav:hover {
            transform: translateY(-2px); /* Efeito de elevação suave */
            filter: brightness(1.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .btn-nav i {
            font-size: 1.1rem;
            line-height: 1;
        }

        /* Ajuste para Navbar em dispositivos móveis */
        @media (max-width: 576px) {
            .navbar-brand { font-size: 1.1rem; }
            .btn-nav { padding: 0.5rem 0.7rem; font-size: 0.85rem; }
        }
    </style>
</head>
<body class="bg-body-tertiary"> <!-- Mudou de bg-light para bg-body-tertiary para adaptar ao tema -->

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1 fw-bold">
            <i class="bi bi-truck text-warning"></i> Área do Gestor
        </span>

        <div class="d-flex gap-2 flex-wrap">
            <a href="/admin/analises" class="btn btn-outline-info btn-nav border-info">
                <i class="bi bi-bar-chart-line-fill"></i> Análises
            </a>

            <a href="/admin/precos" class="btn btn-warning btn-nav text-dark">
                <i class="bi bi-currency-dollar"></i> Preços
            </a>

            <a href="/meus-extratos" class="btn btn-outline-light btn-nav">
                <i class="bi bi-file-earmark-text"></i> Extratos
            </a>

            <!-- NOVO BOTÃO DE DARK MODE -->
            <button id="themeToggleBtn" class="btn btn-secondary btn-nav" title="Alternar Modo Escuro">
                <i id="themeIcon" class="bi bi-moon-fill"></i>
            </button>

            <a href="/sair" class="btn btn-danger btn-nav">
                <i class="bi bi-box-arrow-right"></i> Sair
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5" style="max-width: 800px;">
    <!-- Removido bg-white para o card poder escurecer no dark mode -->
    <div class="card shadow-sm border-0 border-start border-4 border-warning bg-body">
        <div class="card-body p-4">
            <!-- Removido text-dark para adaptar a cor da fonte -->
            <h5 class="fw-bold mb-2">
                <i class="bi bi-lightning-charge-fill text-warning"></i> Coleta Rápida
            </h5>
            <p class="small text-muted mb-3">Atendimento expresso. Informe o nome do cliente para começar.</p>

            <form action="/admin/pesagem-rapida" method="post" class="d-flex flex-column flex-sm-row gap-2">
                <!-- Alterado bg-light do input para adaptar ao tema -->
                <input type="text" name="nome" class="form-control form-control-lg flex-grow-1 bg-body-tertiary text-body" required placeholder="Ex: João da Silva">
                <button type="submit" class="btn btn-success btn-lg fw-bold px-4 text-nowrap">
                    Avançar <i class="bi bi-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<div class="container" style="max-width: 800px;">

    <h5 class="text-muted mb-3 border-bottom pb-2">
        <i class="bi bi-geo-alt-fill text-danger"></i> Clientes Aguardando Pelo Site
    </h5>

    <div class="d-grid gap-3">

        <div th:each="u : ${usuarios}" class="card shadow-sm border-0 border-start border-4 border-success bg-body">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title fw-bold m-0" th:text="${u.nome}">Nome do Cliente</h5>

                    <p class="card-text text-muted small mb-1">
                        <i class="bi bi-whatsapp text-success"></i>
                        <span th:text="${u.telefone}"></span>
                    </p>

                    <p class="text-muted small m-0">
                        <i class="bi bi-geo-alt"></i>
                        <span th:if="${not #lists.isEmpty(u.ofertas)}" th:text="${u.ofertas[0].endereco}">Endereço</span>
                    </p>
                </div>

                <div class="d-flex gap-2">
                    <a th:href="@{'/admin/cancelar/' + ${u.telefone}}" class="btn btn-outline-danger d-flex align-items-center" onclick="return confirm('Tem certeza que deseja cancelar e remover este atendimento da lista?');" title="Cancelar Coleta">
                        <i class="bi bi-trash3-fill"></i>
                    </a>

                    <a th:if="${u.statusPlanilha == 'DISPONIVEL'}" th:href="@{'/admin/atender/' + ${u.id}}" class="btn btn-success fw-bold px-4 d-flex align-items-center gap-2">
                        ATENDER <i class="bi bi-chevron-right"></i>
                    </a>

                    <button th:if="${u.statusPlanilha == 'EM_ATENDIMENTO'}" class="btn btn-secondary fw-bold px-4 disabled" style="cursor: not-allowed;" title="Outro funcionário está atendendo">
                        <i class="bi bi-lock-fill"></i> EM ATENDIMENTO
                    </button>
                </div>

            </div>
        </div>

        <div th:if="${#lists.isEmpty(usuarios)}" class="text-center py-5 text-muted">
            <div class="mb-3">
                <i class="bi bi-check-circle fs-1 text-success opacity-50"></i>
            </div>
            <h5>Nenhum chamado pendente.</h5>
            <small>Aguardando novas solicitações pelo site...</small>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- SCRIPT DO DARK MODE -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');

        // 1. Verifica se já existe um tema salvo no navegador do usuário
        const currentTheme = localStorage.getItem('theme') || 'light';

        // 2. Aplica o tema imediatamente
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateIcon(currentTheme);

        // 3. Adiciona a ação de clique no botão
        themeToggleBtn.addEventListener('click', () => {
            const isDark = htmlElement.getAttribute('data-bs-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';

            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme); // Salva a preferência
            updateIcon(newTheme);
        });

        // Função auxiliar para trocar o ícone (Lua para Sol e vice-versa)
        function updateIcon(theme) {
            if (theme === 'dark') {
                themeIcon.classList.remove('bi-moon-fill');
                themeIcon.classList.add('bi-sun-fill', 'text-warning');
            } else {
                themeIcon.classList.remove('bi-sun-fill', 'text-warning');
                themeIcon.classList.add('bi-moon-fill');
            }
        }
    });
</script>

</body>
</html>
