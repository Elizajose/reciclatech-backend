<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <title>Registrar Saída - Coletaê</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .card { border-radius: 15px; border: none; }
        .table-responsive { border-radius: 10px; overflow: hidden; }
        .item-input { max-width: 150px; }
    </style>
</head>
<body class="bg-body-tertiary">
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <!-- Cabeçalho -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold text-primary m-0"><i class="bi bi-truck me-2"></i> Registrar Venda de Carga</h3>
                <a href="/admin/analises" class="btn btn-secondary shadow-sm">Voltar ao Painel</a>
            </div>

            <!-- Card Principal -->
            <div class="card shadow-sm p-4 bg-body">

                <!-- Alerta de Sucesso ou Erro -->
                <div th:if="${param.erro}" class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle-fill"></i> Nenhuma quantidade informada ou erro ao processar.
                </div>

                <form action="/admin/registrar-saida-lote" method="post">

                    <!-- Dados do Comprador -->
                    <div class="mb-4 p-3 border rounded bg-body-tertiary">
                        <label class="form-label fw-bold text-body-emphasis"><i class="bi bi-building"></i> Nome da Indústria / Comprador Final</label>
                        <input type="text" name="nomeIndustria" class="form-control form-control-lg" required placeholder="Ex: Indústria de Papel XPTO ou Galpão Recife">
                    </div>

                    <h5 class="fw-bold text-body-emphasis mb-3">Materiais da Carga</h5>
                    <p class="text-body-secondary small">Preencha apenas os materiais que estão sendo vendidos. Deixe em branco os que não vão na carga.</p>

                    <!-- Lista de Materiais -->
                    <div class="table-responsive border mb-4">
                        <table class="table table-hover align-middle m-0 bg-body">
                            <thead class="table-light">
                            <tr>
                                <th>Material</th>
                                <th width="20%">Peso (KG/UN)</th>
                                <th width="25%">Preço Venda (R$)</th>
                                <th width="20%" class="text-end">Subtotal</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="m : ${materiais}">
                                <td>
                                    <span class="fw-bold text-body-emphasis" th:text="${m.nome}"></span>
                                </td>
                                <td>
                                    <input type="number" step="0.01" min="0" th:name="'peso_' + ${m.id}" class="form-control item-peso" placeholder="0.00" oninput="calcularTotais()">
                                </td>
                                <td>
                                    <div class="input-group">
                                        <span class="input-group-text">R$</span>
                                        <input type="number" step="0.01" min="0" th:name="'preco_' + ${m.id}" class="form-control item-preco" placeholder="0.00" oninput="calcularTotais()">
                                    </div>
                                </td>
                                <td class="text-end fw-bold text-success subtotal-text">R$ 0,00</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Total e Botão -->
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center p-4 bg-success text-white rounded-4 shadow-sm mb-3">
                        <h4 class="m-0 mb-3 mb-md-0 opacity-75">Total da Carga</h4>
                        <h2 class="fw-bold m-0" id="totalReceber">R$ 0,00</h2>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold py-3 shadow-sm">
                        <i class="bi bi-check2-circle me-2"></i> Confirmar Venda e Gerar Recibo
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuração do Dark Mode Automático
    document.addEventListener('DOMContentLoaded', () => {
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', currentTheme);
    });

    // Função que calcula linha por linha e soma o total geral
    function calcularTotais() {
        let totalGeral = 0;
        const linhas = document.querySelectorAll('tbody tr');

        linhas.forEach(linha => {
            const pesoInput = linha.querySelector('.item-peso');
            const precoInput = linha.querySelector('.item-preco');
            const subtotalCel = linha.querySelector('.subtotal-text');

            const peso = parseFloat(pesoInput.value) || 0;
            const preco = parseFloat(precoInput.value) || 0;
            const subtotal = peso * preco;

            // Atualiza o subtotal da linha
            subtotalCel.innerText = 'R$ ' + subtotal.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});

            // Soma no total geral da carga
            totalGeral += subtotal;
        });

        // Atualiza o visor verde gigante embaixo
        document.getElementById('totalReceber').innerText = 'R$ ' + totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }
</script>
</body>
</html>
