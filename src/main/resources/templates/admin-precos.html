<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <title>Tabela de Preços - Coletaê</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        /* Trava o cabeçalho da tabela no topo quando rolar os itens */
        .table-scroll { max-height: 50vh; overflow-y: auto; }
        .table-scroll thead th { position: sticky; top: 0; z-index: 1; background-color: var(--bs-tertiary-bg); }
    </style>
</head>
<body class="bg-body-tertiary p-3 p-md-5">

<div class="container-lg">

    <!-- CABEÇALHO -->
    <div class="d-flex justify-content-between align-items-center mb-4 d-print-none">
        <h3 class="fw-bold text-body-emphasis m-0">
            <i class="bi bi-tags-fill text-success me-2"></i> Tabela de Preços e Materiais
        </h3>
        <a href="/admin/coletas" class="btn btn-secondary shadow-sm">
            <i class="bi bi-arrow-left"></i> Voltar ao Painel
        </a>
    </div>

    <!-- TÍTULO QUE SÓ APARECE NA IMPRESSÃO DO PDF -->
    <div class="d-none d-print-block mb-4 text-center">
        <h2 class="fw-bold">TABELA OFICIAL DE PREÇOS</h2>
        <p class="text-muted">Data da impressão: <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span></p>
        <hr>
    </div>

    <!-- FORMULÁRIO DE ADICIONAR NOVO (Some na hora da impressão) -->
    <div class="card mb-4 border-success shadow-sm bg-body d-print-none">
        <div class="card-header bg-success text-white fw-bold">
            <i class="bi bi-plus-circle me-1"></i> Cadastrar Novo Material
        </div>
        <div class="card-body">
            <form action="/admin/material/novo" method="post" class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="small fw-bold text-body-secondary mb-1">Nome do Material</label>
                    <input type="text" name="nome" class="form-control" placeholder="Ex: Bateria Velha, Cobre Mel..." required>
                </div>
                <div class="col-md-2">
                    <label class="small fw-bold text-body-secondary mb-1">Unidade</label>
                    <select name="unidade" class="form-select">
                        <option value="KG">KG (Quilo)</option>
                        <option value="UN">UN (Unidade)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="small fw-bold text-body-secondary mb-1">Preço Inicial de Compra</label>
                    <div class="input-group">
                        <span class="input-group-text">R$</span>
                        <input type="number" step="0.01" name="preco" class="form-control" placeholder="0.00" required>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm">
                        <i class="bi bi-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- LISTA DE MATERIAIS COM BUSCA E EXPORTAÇÃO -->
    <div class="card shadow-sm border-0 mb-5 bg-body">
        <div class="card-header bg-body border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center flex-wrap gap-3 d-print-none">
            <h5 class="fw-bold m-0 text-body-emphasis">Materiais Cadastrados</h5>

            <!-- Agrupamento de Ações: Exportar e Buscar -->
            <div class="d-flex align-items-center flex-wrap gap-2">

                <!-- Botão Dropdown Exportar -->
                <div class="dropdown">
                    <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2 shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-download"></i> Exportar
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <li>
                            <!-- GERA O PDF CHAMANDO A TELA DE IMPRESSÃO (CTRL+P) -->
                            <a class="dropdown-item text-danger fw-bold d-flex align-items-center" href="#" onclick="window.print(); return false;">
                                <i class="bi bi-file-earmark-pdf-fill me-2 fs-5"></i> Salvar em PDF
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item text-success fw-bold d-flex align-items-center" href="#" onclick="alert('Funcionalidade de exportar para Excel será liberada em breve!')">
                                <i class="bi bi-file-earmark-excel-fill me-2 fs-5"></i> Salvar em Excel
                            </a>
                        </li>
                    </ul>
                </div>

                <!-- Barra de Pesquisa -->
                <div class="input-group shadow-sm" style="max-width: 300px;">
                    <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="campoBusca" class="form-control border-start-0 ps-0" placeholder="Buscar material rapidamente..." onkeyup="filtrarTabela()">
                </div>
            </div>
        </div>

        <div class="card-body p-0 mt-3">
            <div class="table-scroll">
                <table class="table table-hover align-middle mb-0 bg-body">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Item</th>
                        <th width="30%">Preço Atual</th>
                        <!-- A coluna remover some do PDF -->
                        <th width="15%" class="text-end pe-4 d-print-none">Remover</th>
                    </tr>
                    </thead>
                    <tbody id="tabelaMateriais">
                    <tr th:each="mat : ${materiais}">
                        <td class="ps-4">
                            <span class="fw-bold text-body-emphasis fs-6 nome-item" th:text="${mat.nome}">Cobre</span>
                            <span class="badge bg-secondary-subtle text-secondary border ms-2" th:text="${mat.unidade}">KG</span>
                        </td>
                        <td>
                            <!-- Na tela, mostra as caixas para digitar o preço -->
                            <form action="/admin/atualizar" method="post" class="d-flex gap-2 d-print-none" style="max-width: 250px;">
                                <input type="hidden" name="id" th:value="${mat.id}">
                                <div class="input-group input-group-sm shadow-sm">
                                    <span class="input-group-text bg-body-tertiary">R$</span>
                                    <input type="number" step="0.01" name="novoPreco" class="form-control fw-bold" th:value="${mat.precoPorKg}">
                                    <button class="btn btn-outline-success" title="Atualizar Preço"><i class="bi bi-check-lg"></i></button>
                                </div>
                            </form>
                            <!-- No PDF, esconde a caixa e mostra apenas o texto com o valor limpo -->
                            <span class="d-none d-print-inline fw-bold text-success fs-5">R$ <span th:text="${mat.precoPorKg}">0.00</span></span>
                        </td>
                        <!-- O botão de lixeira some do PDF -->
                        <td class="text-end pe-4 d-print-none">
                            <a th:href="@{'/admin/material/deletar/' + ${mat.id}}"
                               class="btn btn-outline-danger btn-sm shadow-sm"
                               title="Excluir Material"
                               onclick="return confirm('Tem certeza que deseja excluir este item? Isso removerá o material das opções de venda.')">
                                <i class="bi bi-trash3-fill"></i>
                            </a>
                        </td>
                    </tr>
                    <!-- Mensagem mostrada se a busca não encontrar nada -->
                    <tr id="msgVazia" style="display: none;" class="d-print-none">
                        <td colspan="3" class="text-center py-4 text-muted fst-italic">
                            Nenhum material encontrado com este nome.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', currentTheme);
    });

    function filtrarTabela() {
        let input = document.getElementById("campoBusca").value.toLowerCase();
        let linhas = document.querySelectorAll("#tabelaMateriais tr:not(#msgVazia)");
        let temResultado = false;

        linhas.forEach(linha => {
            let nomeItem = linha.querySelector(".nome-item").innerText.toLowerCase();

            if (nomeItem.includes(input)) {
                linha.style.display = "";
                temResultado = true;
            } else {
                linha.style.display = "none";
            }
        });

        document.getElementById("msgVazia").style.display = temResultado ? "none" : "";
    }
</script>
</body>
</html>
