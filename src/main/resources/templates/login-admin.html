<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Acesso Restrito - Coletaê SaaS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- CSS EXTERNO -->
    <link rel="stylesheet" th:href="@{/css/admin-login.css}">
</head>
<body class="d-flex align-items-center justify-content-center p-3" style="min-height: 100vh;">

<div class="card shadow-lg border-0 p-4 w-100 login-card mt-4" style="max-width: 400px;">

    <!-- Ícone de Perfil/Segurança -->
    <div class="icon-circle">
        <i class="bi bi-buildings-fill"></i>
    </div>

    <div class="text-center mb-4 mt-1">
        <h3 class="fw-bold text-success m-0">Área do Parceiro</h3>
        <p class="text-muted small mt-1">Insira suas credenciais de acesso</p>
    </div>

    <!-- Alertas Dinâmicos -->
    <div th:if="${param.erro != null and param.erro[0] == 'true'}" class="alert alert-danger text-center p-2 small fw-bold d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i> Usuário ou senha incorretos.
    </div>

    <div th:if="${param.erro != null and param.erro[0] == 'suspenso'}" class="alert alert-warning text-center p-2 small fw-bold d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-lock-fill"></i> Conta suspensa. Contate o suporte.
    </div>

    <form action="/login-admin" method="post">

        <!-- Campo de Login (Usuário) -->
        <div class="mb-3">
            <div class="input-group input-group-lg shadow-sm">
                <span class="input-group-text bg-white border-end-0 text-success"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="login" class="form-control border-start-0 px-0" placeholder="Seu usuário..." required autofocus>
            </div>
        </div>

        <!-- Campo de Senha com Ícones -->
        <div class="mb-4">
            <div class="input-group input-group-lg shadow-sm">
                <span class="input-group-text bg-white border-end-0 text-success"><i class="bi bi-key-fill"></i></span>
                <input type="password" name="senha" id="senhaInput" class="form-control border-start-0 border-end-0 px-0" placeholder="Sua senha..." required>
                <button class="btn btn-outline-secondary bg-white border-start-0 text-muted" type="button" id="togglePassword">
                    <i class="bi bi-eye-fill" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100 btn-lg fw-bold shadow-sm mb-3">
            Entrar <i class="bi bi-box-arrow-in-right ms-1"></i>
        </button>

        <div class="text-center">
            <a href="/" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left"></i> Voltar para o Site
            </a>
        </div>
    </form>
</div>

<!-- SCRIPT EXTERNO -->
<script th:src="@{/js/admin-login.js}"></script>

</body>
</html>
