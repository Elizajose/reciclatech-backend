<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <title>Histórico de Movimentações - Coletaê</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- CSS EXTERNO -->
    <link rel="stylesheet" th:href="@{/css/admin-historico.css}">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-dark bg-success shadow-sm mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/admin/analises"><i class="bi bi-arrow-left"></i> Voltar</a>
        <span class="text-white fw-bold"><i class="bi bi-clock-history"></i> Histórico Geral</span>
    </div>
</nav>

<div class="container container-historico">
    <div class="card border-0 shadow-sm rounded-4 bg-body">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-4 text-body-emphasis">Todas as Entradas e Saídas</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle bg-body">
                    <thead class="table-light">
                    <tr>
                        <th class="text-muted small text-uppercase">Data</th>
                        <th class="text-muted small text-uppercase">Material</th>
                        <th class="text-muted small text-uppercase">Peso (KG)</th>
                        <th class="text-muted small text-uppercase">Valor Total</th>
                        <th class="text-muted small text-uppercase">Tipo da Operação</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${historico}">
                        <td th:text="${item.data}"></td>
                        <td class="fw-bold text-body-emphasis" th:text="${item.material}"></td>
                        <td th:text="${item.peso}"></td>
                        <td class="text-success fw-bold">R$ <span th:text="${item.precoEstimado}"></span></td>
                        <td>
                            <span class="badge" th:classappend="${item.status.toString() == 'SAIDA_INDUSTRIA'} ? 'bg-primary' : 'bg-secondary'"
                                  th:text="${item.status.toString() == 'SAIDA_INDUSTRIA'} ? 'Venda Indústria' : 'Compra Catador'">
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(historico)}">
                        <td colspan="5" class="text-center text-muted py-4 fst-italic">Nenhuma movimentação encontrada.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SCRIPT EXTERNO -->
<script th:src="@{/js/admin-historico.js}"></script>
</body>
</html>
