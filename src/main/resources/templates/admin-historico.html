<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Histórico de Movimentações - Coletaê</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow-sm mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/admin/coletas"><i class="bi bi-arrow-left"></i> Voltar</a>
        <span class="text-white fw-bold"><i class="bi bi-clock-history"></i> Histórico Geral</span>
    </div>
</nav>

<div class="container">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-4 text-dark">Todas as Entradas e Saídas</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Data</th>
                        <th>Material</th>
                        <th>Peso (KG)</th>
                        <th>Valor Total</th>
                        <th>Tipo da Operação</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${historico}">
                        <td th:text="${item.data}"></td>
                        <td class="fw-bold text-dark" th:text="${item.material}"></td>
                        <td th:text="${item.peso}"></td>
                        <td class="text-success fw-bold">R$ <span th:text="${item.precoEstimado}"></span></td>
                        <td>
                                <span class="badge" th:classappend="${item.status.toString() == 'SAIDA_INDUSTRIA'} ? 'bg-primary' : 'bg-secondary'"
                                      th:text="${item.status.toString() == 'SAIDA_INDUSTRIA'} ? 'Venda Indústria' : 'Compra Catador'">
                                </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(historico)}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhuma movimentação encontrada.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
