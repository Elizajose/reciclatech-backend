<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <title>Fornecedores VIP - Coletaê</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- CSS EXTERNO -->
    <link rel="stylesheet" th:href="@{/css/admin-fornecedores-vip.css}">
</head>
<body class="bg-body-tertiary p-3 p-md-5">

<div class="container-lg">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-body-emphasis m-0"><i class="bi bi-star-fill text-warning me-2"></i> Fornecedores VIP</h3>
        <a href="/admin/coletas" class="btn btn-secondary shadow-sm"><i class="bi bi-arrow-left"></i> Voltar ao Painel</a>
    </div>

    <div class="card mb-4 border-warning shadow-sm bg-body">
        <div class="card-header bg-warning text-dark fw-bold">
            <i class="bi bi-plus-circle me-1"></i> Cadastrar Preço Especial
        </div>
        <div class="card-body">
            <form action="/admin/fornecedores-vip/novo" method="post" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="small fw-bold text-body-secondary mb-1">CPF do Cliente</label>
                    <input type="text" name="cpf" id="cpfVipInput" class="form-control" placeholder="000.000.000-00" maxlength="14" required>
                </div>
                <div class="col-md-4">
                    <label class="small fw-bold text-body-secondary mb-1">Material</label>
                    <select name="material" class="form-select" required>
                        <option value="" disabled selected>Selecione...</option>
                        <option th:each="mat : ${materiais}" th:value="${mat.nome}" th:text="${mat.nome}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="small fw-bold text-body-secondary mb-1">Preço VIP</label>
                    <div class="input-group">
                        <span class="input-group-text">R$</span>
                        <input type="number" step="0.01" name="preco" class="form-control" placeholder="0.00" required>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-warning w-100 fw-bold shadow-sm">
                        <i class="bi bi-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-5 bg-body">
        <div class="card-header bg-body pt-4 pb-3">
            <h5 class="fw-bold m-0 text-body-emphasis">Lista de Preços Diferenciados</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0 bg-body">
                <thead class="table-light">
                <tr>
                    <th class="ps-4">CPF</th>
                    <th>Material</th>
                    <th>Preço Aplicado</th>
                    <th class="text-end pe-4">Remover</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vip : ${vips}">
                    <td class="ps-4 fw-bold" th:text="${vip.cpf}"></td>
                    <td class="text-uppercase" th:text="${vip.material}"></td>
                    <td class="text-success fw-bold">R$ <span th:text="${vip.preco}"></span></td>
                    <td class="text-end pe-4">
                        <a th:href="@{'/admin/fornecedores-vip/deletar?cpf=' + ${vip.cpf} + '&material=' + ${vip.material}}"
                           class="btn btn-outline-danger btn-sm shadow-sm"
                           onclick="confirmarRemocaoVip(event)">
                            <i class="bi bi-trash3-fill"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${vips == null || vips.isEmpty()}">
                    <td colspan="4" class="text-center py-4 text-muted fst-italic">Nenhum fornecedor VIP cadastrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- SCRIPT EXTERNO (Chama o JS limpo que criamos acima) -->
<script th:src="@{/js/admin-fornecedores-vip.js}"></script>
</body>
</html>
