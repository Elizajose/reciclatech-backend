<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Coletaê</title>
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>body{font-family:Inter,sans-serif;background:#f4f7f5}.brand{color:#198754;font-weight:900}</style>
</head>
<body>
<div class="container py-5" style="max-width:460px">
    <div class="text-center mb-4 fs-2 brand"><i class="bi bi-recycle"></i> Coletaê</div>
    <a th:href="@{/}" class="btn btn-link text-decoration-none text-muted px-0 mb-2"><i class="bi bi-arrow-left"></i> Voltar ao início</a>
    <div class="card shadow-sm border-0 rounded-4"><div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">Entrar na sua conta</h1>
        <p class="text-muted small mb-4">Acesso do dono de armazém ou cooperativa.</p>
        <div th:if="${param.criada != null}" class="alert alert-success small fw-bold py-2">Conta criada! Entre com seu e-mail e senha.</div>
        <div th:if="${param.senhaRedefinida != null}" class="alert alert-success small fw-bold py-2">Senha alterada! Entre com a nova senha.</div>
        <div th:if="${erro != null}" class="alert alert-danger small fw-bold py-2" th:text="${erro}"></div>
        <form th:action="@{/conta/login}" method="post">
            <div class="mb-3"><label class="form-label small fw-bold">E-mail</label>
                <input type="email" name="email" class="form-control" th:value="${email}" required autofocus autocomplete="email"></div>
            <div class="mb-4"><label class="form-label small fw-bold">Senha</label>
                <input type="password" name="senha" class="form-control" required autocomplete="current-password">
                <div class="text-end small mt-1"><a th:href="@{/conta/esqueci-senha}" class="text-muted">Esqueci minha senha</a></div></div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Entrar</button>
        </form>
        <p class="text-center small mt-3 mb-1">Ainda não tem conta? <a th:href="@{/conta/cadastro}" class="text-success fw-bold text-decoration-none">Criar conta</a></p>
        <p class="text-center small mb-0 text-muted">Operador ou acesso antigo? <a th:href="@{/login}" class="text-muted">Entre por aqui</a></p>
    </div></div>
</div>
</body>
</html>
