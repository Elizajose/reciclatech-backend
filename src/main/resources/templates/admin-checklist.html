<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <title>Checklist de Pesagem - Coletaê</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: var(--bs-tertiary-bg); }
        .card-pesagem { max-height: 92vh; display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; }
        .area-scroll { overflow-y: auto; flex-grow: 1; padding: 10px 20px; }
        .area-scroll::-webkit-scrollbar { width: 8px; }
        .area-scroll::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.15); border-radius: 10px; }
        [data-bs-theme="dark"] .area-scroll::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); }

        .material-row { transition: background-color 0.2s; border-radius: 8px; }
        .material-row:hover { background-color: rgba(0, 0, 0, 0.02); }
        [data-bs-theme="dark"] .material-row:hover { background-color: rgba(255, 255, 255, 0.05); }

        .form-control:focus { box-shadow: none; border-color: #198754; }
    </style>
</head>
<body class="pb-4 pt-4">

<!-- Aumentei a largura máxima de 650px para 1000px -->
<div class="container" style="max-width: 1000px;">

    <div class="card shadow-lg border-0 card-pesagem bg-body">

        <!-- Cabeçalho Fixo -->
        <div class="card-header bg-success text-white py-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-2 border-0">
            <h4 class="m-0 fw-bold"><i class="bi bi-scale me-2"></i> Atendimento de Balcão</h4>
            <div class="text-end">
                <span class="badge bg-white text-success rounded-pill px-3 py-2 fs-6 text-uppercase shadow-sm">
                    <i class="bi bi-person-fill me-1"></i> <span th:text="${vendedor.nome}">Nome</span>
                </span>
            </div>
        </div>

        <!-- Formulário Ocupando o Restante -->
        <form action="/admin/revisar-coleta" method="post" onsubmit="return validarAntesDeEnviar()" class="d-flex flex-column flex-grow-1 overflow-hidden">
            <input type="hidden" name="idVendedor" id="idVendedor" th:value="${vendedor.id}">

            <!-- Faixa de Instrução -->
            <div class="bg-body-tertiary p-3 border-bottom text-center flex-shrink-0">
                <p class="fw-bold text-muted text-uppercase m-0 small letter-spacing-1">
                    <i class="bi bi-info-circle me-1"></i> Insira os pesos parciais por lote e clique em adicionar. O sistema somará tudo.
                </p>
            </div>

            <!-- ÁREA DE SCROLL INTERNO -->
            <div class="card-body bg-body p-2 p-md-4 area-scroll">
                <div th:each="mat : ${todosMateriais}" class="row align-items-center border-bottom py-3 mx-0 material-row">

                    <!-- Lado Esquerdo: Nome e Preço (Ocupa 4 colunas em telas grandes) -->
                    <div class="col-12 col-lg-4 mb-3 mb-lg-0 text-center text-lg-start">
                        <span class="fw-bold d-block fs-5 text-body-emphasis" th:text="${mat.nome}">Material</span>
                        <div class="d-inline-block bg-success bg-opacity-10 text-success px-2 py-1 rounded small fw-bold mt-1">
                            Base: R$ <span th:text="${mat.precoPorKg}">0.00</span> / <span th:text="${mat.unidade}">KG</span>
                        </div>
                    </div>

                    <!-- Lado Direito: Inputs da Balança (Ocupa 8 colunas em telas grandes, divididas lado a lado) -->
                    <div class="col-12 col-lg-8">
                        <div class="row g-2">
                            <!-- Parcial -->
                            <div class="col-12 col-md-6">
                                <div class="input-group shadow-sm h-100">
                                    <input type="number" step="0.01"
                                           th:id="'parcial_' + ${mat.id}"
                                           class="form-control text-center bg-light"
                                           placeholder="Peso do lote..."
                                           inputmode="decimal">
                                    <button class="btn btn-primary fw-bold" type="button" th:onclick="'adicionarAoTotal(' + ${mat.id} + ')'">
                                        <i class="bi bi-plus-lg"></i> Somar
                                    </button>
                                </div>
                            </div>

                            <!-- Totalizador -->
                            <div class="col-12 col-md-6">
                                <div class="input-group shadow-sm h-100">
                                    <span class="input-group-text bg-light text-muted fw-bold small">TOTAL</span>
                                    <input type="number" step="0.01"
                                           th:name="'qtd_' + ${mat.id}"
                                           th:id="'total_' + ${mat.id}"
                                           class="form-control text-center fw-bold text-success fs-5 bg-white"
                                           placeholder="0.00"
                                           readonly>
                                    <span class="input-group-text bg-light text-muted small fw-bold" th:text="${mat.unidade}">KG</span>
                                    <button class="btn btn-outline-danger" type="button" th:onclick="'zerarTotal(' + ${mat.id} + ')'" title="Zerar item">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RODAPÉ FIXO (BOTÕES) -->
            <div class="card-footer bg-body-tertiary border-top p-4 flex-shrink-0">
                <div class="row g-3">
                    <div class="col-md-8">
                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm py-3">
                            AVANÇAR PARA REVISÃO <i class="bi bi-arrow-right-circle ms-2"></i>
                        </button>
                    </div>
                    <div class="col-md-4">
                        <a href="/admin/coletas" class="btn btn-outline-secondary btn-lg w-100 fw-bold py-3" onclick="limparRascunho()">
                            Cancelar
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', currentTheme);
    });

    document.addEventListener("DOMContentLoaded", function() {
        let idVendedor = document.getElementById('idVendedor').value;
        let rascunhoString = sessionStorage.getItem('rascunho_pesagem_' + idVendedor);

        if (rascunhoString) {
            let rascunho = JSON.parse(rascunhoString);
            let agora = new Date().getTime();

            if (agora - rascunho.timestamp < 7200000) {
                for (let idInput in rascunho.pesos) {
                    let campoTotal = document.getElementById(idInput);
                    if (campoTotal) { campoTotal.value = rascunho.pesos[idInput]; }
                }
            } else { sessionStorage.removeItem('rascunho_pesagem_' + idVendedor); }
        }
    });

    function adicionarAoTotal(id) {
        let inputParcial = document.getElementById('parcial_' + id);
        let inputTotal = document.getElementById('total_' + id);

        let valorParcial = parseFloat(inputParcial.value.replace(',', '.'));
        let valorTotal = parseFloat(inputTotal.value) || 0;

        if (!isNaN(valorParcial) && valorParcial > 0) {
            let novoTotal = valorTotal + valorParcial;
            inputTotal.value = novoTotal.toFixed(2);
            inputParcial.value = '';
            inputParcial.focus();
        }
    }

    function zerarTotal(id) {
        document.getElementById('total_' + id).value = '';
        document.getElementById('parcial_' + id).value = '';
    }

    function validarAntesDeEnviar() {
        let idVendedor = document.getElementById('idVendedor').value;
        let inputsParciais = document.querySelectorAll('input[id^="parcial_"]');

        inputsParciais.forEach(function(input) {
            let valor = parseFloat(input.value.replace(',', '.'));
            if (!isNaN(valor) && valor > 0) {
                let idMaterial = input.id.split('_')[1];
                adicionarAoTotal(idMaterial);
            }
        });

        let rascunho = { timestamp: new Date().getTime(), pesos: {} };
        let inputsTotais = document.querySelectorAll('input[id^="total_"]');
        inputsTotais.forEach(function(input) {
            if (input.value && parseFloat(input.value) > 0) { rascunho.pesos[input.id] = input.value; }
        });

        sessionStorage.setItem('rascunho_pesagem_' + idVendedor, JSON.stringify(rascunho));
        return true;
    }

    function limparRascunho() {
        let idVendedor = document.getElementById('idVendedor').value;
        sessionStorage.removeItem('rascunho_pesagem_' + idVendedor);
    }
</script>
</body>
</html>
