<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <title>Checklist de Pesagem - Coletaê</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- SEU CSS EXTERNO -->
    <link rel="stylesheet" th:href="@{/css/admin-checklist.css}">
</head>
<body class="pb-4 pt-4">

<div class="container" style="max-width: 1000px;">
    <div class="card shadow-lg border-0 card-pesagem bg-body">

        <div class="card-header bg-success text-white py-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-2 border-0">
            <h4 class="m-0 fw-bold"><i class="bi bi-scale me-2"></i> Atendimento de Balcão</h4>
            <div class="text-end">
                <span class="badge bg-white text-success rounded-pill px-3 py-2 fs-6 text-uppercase shadow-sm">
                    <i class="bi bi-person-fill me-1"></i> <span th:text="${vendedor.nome}">Nome</span>
                </span>
            </div>
        </div>

        <form action="/admin/revisar-coleta" method="post" onsubmit="return validarAntesDeEnviar()" class="d-flex flex-column flex-grow-1 overflow-hidden">
            <input type="hidden" name="idVendedor" id="idVendedor" th:value="${vendedor.id}">

            <div class="bg-body-tertiary p-3 border-bottom text-center flex-shrink-0">
                <p class="fw-bold text-muted text-uppercase m-0 small letter-spacing-1">
                    <i class="bi bi-info-circle me-1"></i> Insira os pesos parciais por lote e clique em adicionar. O sistema somará tudo.
                </p>
            </div>

            <div class="card-body bg-body p-2 p-md-4 area-scroll">
                <div th:each="mat : ${todosMateriais}" class="row align-items-center border-bottom py-3 mx-0 material-row">

                    <div class="col-12 col-lg-4 mb-3 mb-lg-0 text-center text-lg-start">
                        <span class="fw-bold d-block fs-5 text-body-emphasis" th:text="${mat.nome}">Material</span>
                        <div class="d-inline-block bg-success bg-opacity-10 text-success px-2 py-1 rounded small fw-bold mt-1">
                            <span th:if="${precosVip != null && precosVip.containsKey(mat.nome)}" class="badge bg-warning text-dark me-1 px-1 py-0 shadow-sm">VIP</span>
                            Base: R$ <span th:text="${precosVip != null && precosVip.containsKey(mat.nome) ? precosVip.get(mat.nome) : mat.precoPorKg}">0.00</span> / <span th:text="${mat.unidade}">KG</span>
                        </div>
                    </div>

                    <div class="col-12 col-lg-8">
                        <div class="row g-2">
                            <div class="col-12 col-md-6">
                                <div class="input-group shadow-sm h-100">
                                    <input type="number" step="0.01"
                                           th:id="'parcial_' + ${mat.id}"
                                           class="form-control text-center bg-light"
                                           placeholder="Peso do lote..."
                                           inputmode="decimal">
                                    <button class="btn btn-primary fw-bold" type="button" th:onclick="'adicionarAoTotal(' + ${mat.id} + ')'">
                                        <i class="bi bi-plus-lg"></i> Somar
                                    </button>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <div class="input-group shadow-sm h-100">
                                    <span class="input-group-text bg-light text-muted fw-bold small">TOTAL</span>
                                    <input type="number" step="0.01"
                                           th:name="'qtd_' + ${mat.id}"
                                           th:id="'total_' + ${mat.id}"
                                           class="form-control text-center fw-bold text-success fs-5 bg-white"
                                           placeholder="0.00"
                                           readonly>
                                    <span class="input-group-text bg-light text-muted small fw-bold" th:text="${mat.unidade}">KG</span>
                                    <button class="btn btn-outline-danger" type="button" th:onclick="'zerarTotal(' + ${mat.id} + ')'" title="Zerar item">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-footer bg-body-tertiary border-top p-4 flex-shrink-0">
                <div class="row g-3">
                    <div class="col-md-8">
                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm py-3">
                            AVANÇAR PARA REVISÃO <i class="bi bi-arrow-right-circle ms-2"></i>
                        </button>
                    </div>
                    <div class="col-md-4">
                        <a href="/admin/coletas" class="btn btn-outline-secondary btn-lg w-100 fw-bold py-3" onclick="limparRascunho()">
                            Cancelar
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<!--  SCRIPT EXTERNO -->
<script th:src="@{/js/admin-checklist.js}"></script>
</body>
</html>
