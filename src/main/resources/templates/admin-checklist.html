<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checklist de Pesagem</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/img/logo.png}" type="image/x-icon">
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do Bootstrap para os botões de adicionar e apagar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light pb-5">

<div class="container mt-3" style="max-width: 600px;">

    <div class="card shadow mb-4 border-0">
        <div class="card-header bg-success text-white py-3">
            <h5 class="m-0 fw-bold"><i class="bi bi-scale"></i> 1. Pesagem</h5>
            <small th:text="${vendedor.nome}" class="text-white-50">Nome do Cliente</small>
        </div>

        <div class="card-body bg-white p-4">
            <!-- Adicionado o onsubmit aqui -->
            <form action="/admin/revisar-coleta" method="post" onsubmit="return validarAntesDeEnviar()">
                <input type="hidden" name="idVendedor" th:value="${vendedor.id}">

                <h6 class="border-bottom pb-3 mb-4 fw-bold text-secondary text-center text-uppercase">
                    Insira os pesos parciais e some (KG/UN)
                </h6>

                <div th:each="mat : ${todosMateriais}" class="row mb-4 align-items-center border-bottom pb-3">
                    <!-- Coluna de Informações do Material -->
                    <div class="col-6">
                        <span class="fw-bold d-block fs-5" th:text="${mat.nome}">Cobre</span>
                        <small class="text-success fw-bold" th:text="'Base: R$ ' + ${mat.precoPorKg}">Preço</small>
                        <small class="text-muted" th:text="'/' + ${mat.unidade}">/KG</small>
                    </div>

                    <!-- Coluna de Inputs (Pesagem parcial + Total) -->
                    <div class="col-6">

                        <!-- 1. Campo para pesar os lotes parciais -->
                        <div class="input-group input-group-sm mb-2 shadow-sm">
                            <input type="number" step="0.01"
                                   th:id="'parcial_' + ${mat.id}"
                                   class="form-control text-center bg-light"
                                   placeholder="Pesar lote..."
                                   inputmode="decimal">
                            <button class="btn btn-primary fw-bold" type="button" th:onclick="'adicionarAoTotal(' + ${mat.id} + ')'" title="Adicionar peso">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>

                        <!-- 2. Campo do Total Acumulado -->
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light text-secondary" style="font-size: 0.75rem;">Total</span>

                            <input type="number" step="0.01"
                                   th:name="'qtd_' + ${mat.id}"
                                   th:id="'total_' + ${mat.id}"
                                   class="form-control text-center fw-bold text-success bg-white"
                                   placeholder="0"
                                   readonly>

                            <span class="input-group-text small" style="font-size: 0.75rem;" th:text="${mat.unidade}">KG</span>

                            <button class="btn btn-outline-danger" type="button" th:onclick="'zerarTotal(' + ${mat.id} + ')'" title="Zerar balança">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-5">
                    <button type="submit" class="btn btn-success btn-lg fw-bold p-3 shadow-sm">
                        AVANÇAR PARA REVISÃO >>
                    </button>
                    <a href="/admin/coletas" class="btn btn-outline-secondary py-3">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function adicionarAoTotal(id) {
        let inputParcial = document.getElementById('parcial_' + id);
        let inputTotal = document.getElementById('total_' + id);

        let valorParcial = parseFloat(inputParcial.value.replace(',', '.'));
        let valorTotal = parseFloat(inputTotal.value) || 0;

        if (!isNaN(valorParcial) && valorParcial > 0) {
            let novoTotal = valorTotal + valorParcial;
            inputTotal.value = novoTotal.toFixed(2);
            inputParcial.value = '';
            inputParcial.focus();
        }
    }

    function zerarTotal(id) {
        document.getElementById('total_' + id).value = '';
        document.getElementById('parcial_' + id).value = '';
    }

    // NOVA FUNÇÃO: Roda automaticamente ao clicar no botão de Avançar
    function validarAntesDeEnviar() {
        // Pega todos os inputs que começam com "parcial_"
        let inputsParciais = document.querySelectorAll('input[id^="parcial_"]');

        inputsParciais.forEach(function(input) {
            let valor = parseFloat(input.value.replace(',', '.'));

            // Se o campo tiver algum valor válido esquecido nele...
            if (!isNaN(valor) && valor > 0) {
                // Extrai o ID numérico do final do id do input
                let idMaterial = input.id.split('_')[1];
                // Chama a função de adicionar para jogar o valor pro campo Total
                adicionarAoTotal(idMaterial);
            }
        });

        // Retorna true para permitir que o formulário continue e mude de tela
        return true;
    }
</script>

</body>
</html>
