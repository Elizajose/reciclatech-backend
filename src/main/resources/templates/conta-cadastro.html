<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | Coletaê</title>
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin-login.css?v=3}">
    <style th:replace="~{fragments/auth :: estilo}"></style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">
        <div th:replace="~{fragments/auth :: lateral('O futuro da reciclagem chegou.', 'Crie sua conta e tenha o controle total do seu galpão na palma da mão.', '/img/cadastro.png', true)}"></div>

        <div class="col-lg-6 col-md-7 d-flex align-items-center justify-content-center p-4 bg-white">
            <div class="w-100" style="max-width: 420px;">
                <div class="d-md-none d-flex align-items-center gap-2 fs-2 fw-bold auth-logo-mobile mb-3 justify-content-center"><i class="bi bi-recycle"></i> Coletaê</div>
                <a th:href="@{/}" data-voltar class="btn btn-link text-decoration-none text-muted px-0 mb-3 d-flex align-items-center gap-2" style="width: fit-content;"><i class="bi bi-arrow-left"></i> Voltar</a>
                <h2 class="fw-bold text-dark mb-1">Criar conta</h2>
                <p class="text-muted small mb-4">Esta é a conta do dono. Depois de entrar, você cadastra seus armazéns ou cooperativas.</p>
                <div th:if="${erro != null}" class="alert alert-danger small fw-bold py-2" th:text="${erro}"></div>
                <form th:action="@{/conta/cadastro}" method="post">
                    <div class="mb-3"><label class="form-label small fw-bold text-dark">Seu nome</label>
                        <input type="text" name="nome" class="form-control form-control-lg fs-6" th:value="${nome}" maxlength="120" required autofocus autocomplete="name"></div>
                    <div class="mb-3"><label class="form-label small fw-bold text-dark">E-mail</label>
                        <input type="email" name="email" class="form-control form-control-lg fs-6" th:value="${email}" maxlength="160" required autocomplete="email">
                        <div class="form-text">Será usado para entrar e para recuperar a senha.</div></div>
                    <div class="mb-3"><label class="form-label small fw-bold text-dark">Senha</label>
                        <input type="password" name="senha" class="form-control form-control-lg fs-6" minlength="8" maxlength="72" required autocomplete="new-password">
                        <div class="form-text">Mínimo de 8 caracteres.</div></div>
                    <div class="mb-4"><label class="form-label small fw-bold text-dark">Confirmar senha</label>
                        <input type="password" name="confirmarSenha" class="form-control form-control-lg fs-6" minlength="8" maxlength="72" required autocomplete="new-password"></div>
                    <button type="submit" class="btn btn-success w-100 btn-lg fw-bold shadow-sm rounded-3">Criar conta</button>
                </form>
                <p class="text-center small mt-4 mb-0">Já tem conta? <a th:href="@{/login}" class="text-success fw-bold text-decoration-none">Entrar</a></p>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/voltar.js}"></script>
</body>
</html>
