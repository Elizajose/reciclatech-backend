<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | Coletaê</title>
    <link rel="icon" th:href="@{/img/logo.png}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>body{font-family:Inter,sans-serif;background:#f4f7f5}.brand{color:#198754;font-weight:900}</style>
</head>
<body>
<div class="container py-5" style="max-width:460px">
    <div class="text-center mb-4 fs-2 brand"><i class="bi bi-recycle"></i> Coletaê</div>
    <div class="card shadow-sm border-0 rounded-4"><div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">Criar conta</h1>
        <p class="text-muted small mb-4">Esta é a conta do dono. Depois de entrar, você cadastra seus armazéns ou cooperativas.</p>
        <div th:if="${erro != null}" class="alert alert-danger small fw-bold py-2" th:text="${erro}"></div>
        <form th:action="@{/conta/cadastro}" method="post">
            <div class="mb-3"><label class="form-label small fw-bold">Seu nome</label>
                <input type="text" name="nome" class="form-control" th:value="${nome}" maxlength="120" required autofocus></div>
            <div class="mb-3"><label class="form-label small fw-bold">E-mail</label>
                <input type="email" name="email" class="form-control" th:value="${email}" maxlength="160" required autocomplete="email">
                <div class="form-text">Será usado para entrar e, em breve, para recuperar a senha.</div></div>
            <div class="mb-3"><label class="form-label small fw-bold">Senha</label>
                <input type="password" name="senha" class="form-control" minlength="8" maxlength="72" required autocomplete="new-password">
                <div class="form-text">Mínimo de 8 caracteres.</div></div>
            <div class="mb-4"><label class="form-label small fw-bold">Confirmar senha</label>
                <input type="password" name="confirmarSenha" class="form-control" minlength="8" maxlength="72" required autocomplete="new-password"></div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Criar conta</button>
        </form>
        <p class="text-center small mt-3 mb-0">Já tem conta? <a th:href="@{/conta/login}" class="text-success fw-bold text-decoration-none">Entrar</a></p>
    </div></div>
</div>
</body>
</html>
