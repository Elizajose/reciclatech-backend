# SENHAS LOCAIS: lê o arquivo .env da raiz do projeto, se existir (ver .env.example)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coletae_db}
spring.datasource.username=${DB_USUARIO_COLETAE:postgres}
spring.datasource.password=${DB_PASSWORD_COLETAE}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SENHA DO PAINEL MASTER (sem SENHA_MASTER definida, o login master fica desativado)
coletae.senha-master=${SENHA_MASTER:}

# CONFIGURAÇÕES DE SUPORTE (GMAIL)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_COLETAE:contatocoletae@gmail.com}
spring.mail.password=${SENHA_EMAIL_COLETAE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# E-mail que recebe os chamados de suporte
coletae.email-suporte=${EMAIL_SUPORTE:contatocoletae@gmail.com}

# Limites para upload de arquivos (Prints de Tela no Suporte)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Recuperação de senha por e-mail
coletae.url-base=${URL_BASE:http://localhost:8080}
coletae.dev-log-links=${COLETAE_DEV_LOG_LINKS:false}

# --- Fase 9: segurança da sessão e do site ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Só use COOKIE_SECURE=true se o site abre por HTTPS (https://...). Em http puro o login deixa de funcionar.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
# Atrás de proxy (nginx etc.), usa o IP e o protocolo reais enviados pelo proxy
server.forward-headers-strategy=framework
# Recusa POST vindo de outro site (CSRF). Em emergência: CSRF_ORIGEM=false
coletae.csrf-origem=${CSRF_ORIGEM:true}

# Arquivos estáticos (JS/CSS): o navegador sempre confere se há versão nova (evita tela com JS antigo após atualização)
spring.web.resources.cache.cachecontrol.no-cache=true

# --- Fase 10: health check e logs ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.com.reciclatech=INFO
coletae.preco-max-multiplo=${PRECO_MAX_MULTIPLO:2}
