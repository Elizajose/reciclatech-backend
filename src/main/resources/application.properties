spring.datasource.url=jdbc:postgresql://localhost:5432/coletae_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD_COLETAE}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SENHA DO PAINEL MASTER (sem SENHA_MASTER definida, o login master fica desativado)
coletae.senha-master=${SENHA_MASTER:}

# CONFIGURAÇÕES DE SUPORTE (GMAIL)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=contatocoletae@gmail.com
spring.mail.password=${SENHA_EMAIL_COLETAE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Limites para upload de arquivos (Prints de Tela no Suporte)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB