# SENHAS LOCAIS: lê o arquivo .env da raiz do projeto, se existir (ver .env.example)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coletae_db}
spring.datasource.username=${DB_USUARIO_COLETAE:postgres}
spring.datasource.password=${DB_PASSWORD_COLETAE}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SENHA DO PAINEL MASTER (sem SENHA_MASTER definida, o login master fica desativado)
coletae.senha-master=${SENHA_MASTER:}

# CONFIGURAÇÕES DE SUPORTE (GMAIL)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_COLETAE:contatocoletae@gmail.com}
spring.mail.password=${SENHA_EMAIL_COLETAE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# E-mail que recebe os chamados de suporte
coletae.email-suporte=${EMAIL_SUPORTE:contatocoletae@gmail.com}

# Limites para upload de arquivos (Prints de Tela no Suporte)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
