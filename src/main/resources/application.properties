# Nome da Aplicação
spring.application.name=Coletae

# --- CONFIGURAÇÕES DO GOOGLE SHEETS ---
# Busca o ID da variável GOOGLE_SHEETS_ID do Render ou usa o seu ID padrão
google.sheets.id=${GOOGLE_SHEETS_ID:15ZPzZ9Gxm5ivXm-SpqgmCbj2CKPqzwdCyQu44kkgO0Q}

# Busca o caminho do JSON da variável GOOGLE_CREDENTIALS_PATH ou usa o local
# No Render será: /etc/secrets/google-credentials.json
# No Local será: credentials.json (dentro de src/main/resources)
google.credentials.path=${GOOGLE_CREDENTIALS_PATH:credentials.json}

# --- DESATIVANDO O JPA/POSTGRES ---
# Impede que o Spring tente conectar ao Neon.tech (que atingiu o limite)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Remove a configuração automática de Banco de Dados para evitar erros de inicialização
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

