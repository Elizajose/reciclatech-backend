name: CI

# Compila e roda os testes a cada push/PR. NÃO faz deploy: só avisa se algo quebrou.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coletae_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/coletae_test
      DB_USUARIO_COLETAE: postgres
      DB_PASSWORD_COLETAE: postgres
      SENHA_EMAIL_COLETAE: ci-nao-usado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar e testar
        run: ./mvnw -B -ntp verify
